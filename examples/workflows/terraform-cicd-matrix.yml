name: Terraform Networking

on:
  pull_request:
    paths:
      - "networking/**"
      - ".github/workflows/terraform-cicd-matrix.yml"
  push:
    branches:
      - main
    paths:
      - "networking/**"
      - ".github/workflows/terraform-cicd-matrix.yml"

concurrency:
  group: terraform-3-networking-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  shared-vpc-host-cicd:
    uses: mt0pps/tf-gcp-workflow-templates/.github/workflows/terraform-cicd-matrix.yml@main
    secrets: inherit
    with:
      runner: private-runners
      terraform_version: 1.15.7
      checkout_app_id: ${{ vars.CHECKOUT_APP_ID }}
      directory: networking/shared-vpcs
      environments: '["dev", "nprd", "onprem", "prod"]'
      max_parallel: 4
      gcp_workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      gcp_service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

  ncc-hub-cicd:
    uses: mt0pps/tf-gcp-workflow-templates/.github/workflows/terraform-cicd-matrix.yml@main
    secrets: inherit
    with:
      runner: private-runners
      terraform_version: 1.15.7
      checkout_app_id: ${{ vars.CHECKOUT_APP_ID }}
      directory: networking/ncc-hub
      environments: '["dev", "nprd", "prod"]'
      max_parallel: 3
      gcp_workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      gcp_service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
