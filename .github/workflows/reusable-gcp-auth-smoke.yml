name: Reusable GCP Auth Smoke

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label to execute on.
        required: false
        type: string
        default: arc-runner-set
      terraform_version:
        description: Terraform version to install.
        required: false
        type: string
        default: 1.12.2
      terraform_directory:
        description: Terraform root directory to run fmt against.
        required: true
        type: string
      gcp_project_id:
        description: Google Cloud project ID to verify access against.
        required: true
        type: string
      gcp_workload_identity_provider:
        description: Google workload identity provider resource name.
        required: true
        type: string
      gcp_service_account:
        description: Google service account email used for GitHub OIDC.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  auth-smoke-test:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
          service_account: ${{ inputs.gcp_service_account }}
          create_credentials_file: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3.0.1

      - name: Verify active identity
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth list
          active_account=$(gcloud auth list --filter=status:ACTIVE --format='value(account)')
          test -n "$active_account"
          echo "Authenticated as: $active_account"

      - name: Verify project access
        shell: bash
        run: |
          set -euo pipefail
          gcloud projects describe "${{ inputs.gcp_project_id }}" --format='value(projectNumber)'

      - name: Terraform fmt check
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="${{ inputs.terraform_directory }}" fmt -check -diff -recursive