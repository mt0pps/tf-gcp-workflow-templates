name: Reusable Terraform CI

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label to execute on.
        required: false
        type: string
        default: arc-runner-set
      terraform_version:
        description: Terraform version to install.
        required: false
        type: string
        default: 1.12.2
      directory:
        description: Terraform stack directory relative to repository root.
        required: true
        type: string
      environment:
        description: Environment key used to resolve backend settings from .tinitgcp.
        required: false
        type: string
        default: ""
      tfvars:
        description: Optional tfvars file path relative to the stack directory for plan runs.
        required: false
        type: string
        default: ""
      gcp_project_id:
        description: Google Cloud project ID for plan validation.
        required: false
        type: string
        default: ""
      gcp_workload_identity_provider:
        description: Google workload identity provider resource name for plan auth.
        required: false
        type: string
        default: ""
      gcp_service_account:
        description: Google service account email used for GitHub OIDC plan auth.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  fmt:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Terraform fmt
        shell: bash
        run: terraform -chdir="${{ inputs.directory }}" fmt -check -diff -recursive

  validate:
    needs: fmt
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Ensure plugin cache directory exists
        shell: bash
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform plugins
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-${{ inputs.directory }}-${{ hashFiles(format('{0}/**/.terraform.lock.hcl', inputs.directory)) }}
          restore-keys: |
            ${{ runner.os }}-terraform-${{ inputs.directory }}-
            ${{ runner.os }}-terraform-

      - name: Terraform init without backend
        if: ${{ inputs.environment == '' }}
        shell: bash
        run: terraform -chdir="${{ inputs.directory }}" init -backend=false

      - name: List available actions hooks
        if: ${{ inputs.environment != '' }}
        shell: bash
        run: ls -la "$GITHUB_WORKSPACE/bin/" | grep -E "tinitgcp|init" || echo "Check for tinitgcp binary"

      - name: Terraform validate
        shell: bash
        run: terraform -chdir="${{ inputs.directory }}" validate

  plan:
    needs: validate
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && inputs.gcp_workload_identity_provider != '' && inputs.gcp_service_account != '' }}
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
          service_account: ${{ inputs.gcp_service_account }}
          create_credentials_file: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Ensure plugin cache directory exists
        shell: bash
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform plugins
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-${{ inputs.directory }}-${{ hashFiles(format('{0}/**/.terraform.lock.hcl', inputs.directory)) }}
          restore-keys: |
            ${{ runner.os }}-terraform-${{ inputs.directory }}-
            ${{ runner.os }}-terraform-

      - name: Terraform init
        shell: bash
        run: terraform -chdir="${{ inputs.directory }}" init -backend=false

      - name: Terraform plan
        shell: bash
        run: terraform -chdir="${{ inputs.directory }}" plan -refresh=false -lock=false -input=false -compact-warnings ${{ inputs.tfvars != '' && format('-var-file="{0}"', inputs.tfvars) || '' }}
