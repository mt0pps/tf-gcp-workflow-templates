name: GCP Auth Smoke

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label to execute on.
        required: false
        type: string
        default: arc-runner-set
      terraform_version:
        description: Terraform version to install.
        required: false
        type: string
        default: 1.12.2
      terraform_directory:
        description: Terraform root directory to validate and lint.
        required: true
        type: string
      gcp_project_id:
        description: Google Cloud project ID to verify access against.
        required: true
        type: string
      gcp_workload_identity_provider:
        description: Google workload identity provider resource name.
        required: true
        type: string
      gcp_service_account:
        description: Google service account email used for GitHub OIDC.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  auth-smoke-test:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
          service_account: ${{ inputs.gcp_service_account }}
          create_credentials_file: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@77e7a554d41e2ee56fc945c52dfd3f33d12def9a # v2.1.4

      - name: Verify active identity
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth list
          active_account=$(gcloud auth list --filter=status:ACTIVE --format='value(account)')
          test -n "$active_account"
          echo "Authenticated as: $active_account"

      - name: Verify project access
        shell: bash
        run: |
          set -euo pipefail
          gcloud projects describe "${{ inputs.gcp_project_id }}" --format='value(projectNumber)'

      - name: Terraform init
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="${{ inputs.terraform_directory }}" init -backend=false

      - name: Terraform validate
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="${{ inputs.terraform_directory }}" validate

      - name: Terraform lint
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ inputs.terraform_directory }}"
          tflint --init
          tflint --recursive --call-module-type=all