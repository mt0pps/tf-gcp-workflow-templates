name: Terraform CI/CD Matrix

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label to execute on.
        required: false
        type: string
        default: mt0pps-runners
      terraform_version:
        description: Terraform version to install.
        required: false
        type: string
        default: 1.12.2
      directory:
        description: Terraform stack directory relative to repository root.
        required: true
        type: string
      plan_matrix:
        description: JSON array of objects for matrix CI runs.
        required: false
        type: string
        default: "[]"
      apply_matrix:
        description: JSON array of objects for matrix CD runs.
        required: false
        type: string
        default: "[]"
      max_parallel:
        description: Maximum parallelism for matrix plan runs.
        required: false
        type: number
        default: 1
      gcp_workload_identity_provider:
        description: Google workload identity provider resource name.
        required: false
        type: string
        default: ""
      gcp_service_account:
        description: Google service account email for GitHub OIDC auth.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  # ============================================================================
  # CI: Validate and Plan Matrix
  # ============================================================================
  validate:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Terraform and TFLint
        uses: mt0pps/tf-gcp-workflow-templates/.github/actions/terraform-setup@main
        with:
          terraform_version: ${{ inputs.terraform_version }}
          directory: ${{ inputs.directory }}

      - name: Validate and Lint
        uses: mt0pps/tf-gcp-workflow-templates/.github/actions/terraform-validate@main
        with:
          directory: ${{ inputs.directory }}

  plan-matrix:
    needs: validate
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && inputs.plan_matrix != '[]' && inputs.gcp_workload_identity_provider != '' && inputs.gcp_service_account != '' }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max_parallel }}
      matrix:
        include: ${{ fromJson(inputs.plan_matrix) }}
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Authenticate to Google Cloud
        uses: mt0pps/tf-gcp-workflow-templates/.github/actions/gcp-auth@main
        with:
          gcp_workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
          gcp_service_account: ${{ inputs.gcp_service_account }}

      - name: Setup Terraform and TFLint
        uses: mt0pps/tf-gcp-workflow-templates/.github/actions/terraform-setup@main
        with:
          terraform_version: ${{ inputs.terraform_version }}
          directory: ${{ inputs.directory }}

      - name: Terraform Plan
        uses: mt0pps/tf-gcp-workflow-templates/.github/actions/terraform-plan@main
        with:
          directory: ${{ inputs.directory }}
          environment: ${{ matrix.environment }}
          tfvars: ${{ matrix.tfvars }}

  # ============================================================================
  # CD: Apply Matrix (only on main after CI passes)
  # ============================================================================
  apply-matrix:
    needs: validate
    if: ${{ github.ref == 'refs/heads/main' && inputs.apply_matrix != '[]' && inputs.gcp_workload_identity_provider != '' && inputs.gcp_service_account != '' }}
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.apply_matrix) }}
    concurrency:
      group: terraform-${{ inputs.directory }}-${{ matrix.environment }}-apply
      cancel-in-progress: false
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout templates repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: mt0pps/tf-gcp-workflow-templates
          ref: main
          path: templates
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to Google Cloud
        uses: mt0pps/tf-gcp-workflow-templates/.github/actions/gcp-auth@main
        with:
          gcp_workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
          gcp_service_account: ${{ inputs.gcp_service_account }}

      - name: Setup Terraform
        uses: mt0pps/tf-gcp-workflow-templates/.github/actions/terraform-setup@main
        with:
          terraform_version: ${{ inputs.terraform_version }}
          directory: ${{ inputs.directory }}

      - name: Terraform Apply
        uses: mt0pps/tf-gcp-workflow-templates/.github/actions/terraform-apply@main
        with:
          directory: ${{ inputs.directory }}
          environment: ${{ matrix.environment }}
          tfvars: ${{ matrix.tfvars }}
