name: Terraform CD

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label to execute on.
        required: false
        type: string
        default: arc-runner-set
      terraform_version:
        description: Terraform version to install.
        required: false
        type: string
        default: 1.12.2
      directory:
        description: Terraform stack directory relative to repository root.
        required: true
        type: string
      environment:
        description: Single environment key used to resolve backend settings from .tinitgcp.
        required: false
        type: string
        default: ""
      tfvars:
        description: Optional tfvars file path relative to the stack directory for single apply runs.
        required: false
        type: string
        default: ""
      apply_matrix:
        description: JSON array of objects with environment and tfvars keys for matrix apply runs.
        required: false
        type: string
        default: "[]"
      gcp_workload_identity_provider:
        description: Google workload identity provider resource name for apply auth.
        required: false
        type: string
        default: ""
      gcp_service_account:
        description: Google service account email used for GitHub OIDC apply auth.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  apply:
    if: ${{ github.ref == 'refs/heads/main' && inputs.environment != '' && inputs.tfvars != '' && inputs.gcp_workload_identity_provider != '' && inputs.gcp_service_account != '' }}
    runs-on: ${{ inputs.runner }}
    concurrency:
      group: terraform-${{ inputs.directory }}-${{ inputs.environment }}-apply
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
          service_account: ${{ inputs.gcp_service_account }}
          create_credentials_file: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Ensure plugin cache directory exists
        shell: bash
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform plugins
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-${{ inputs.directory }}-${{ hashFiles(format('{0}/**/.terraform.lock.hcl', inputs.directory)) }}
          restore-keys: |
            ${{ runner.os }}-terraform-${{ inputs.directory }}-
            ${{ runner.os }}-terraform-

      - name: Terraform init with tinitgcp
        shell: bash
        run: cd "${{ inputs.directory }}" && bash "$GITHUB_WORKSPACE/bin/tinitgcp" "${{ inputs.environment }}"

      - name: Terraform apply
        shell: bash
        run: terraform -chdir="${{ inputs.directory }}" apply -auto-approve -input=false -compact-warnings -var-file="${{ inputs.tfvars }}"

  apply-matrix:
    if: ${{ github.ref == 'refs/heads/main' && inputs.apply_matrix != '[]' && inputs.gcp_workload_identity_provider != '' && inputs.gcp_service_account != '' }}
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.apply_matrix) }}
    concurrency:
      group: terraform-${{ inputs.directory }}-${{ matrix.environment }}-apply
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
          service_account: ${{ inputs.gcp_service_account }}
          create_credentials_file: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Ensure plugin cache directory exists
        shell: bash
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform plugins
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-${{ inputs.directory }}-${{ hashFiles(format('{0}/**/.terraform.lock.hcl', inputs.directory)) }}
          restore-keys: |
            ${{ runner.os }}-terraform-${{ inputs.directory }}-
            ${{ runner.os }}-terraform-

      - name: Terraform init with tinitgcp
        shell: bash
        run: cd "${{ inputs.directory }}" && bash "$GITHUB_WORKSPACE/bin/tinitgcp" "${{ matrix.environment }}"

      - name: Terraform apply
        shell: bash
        run: terraform -chdir="${{ inputs.directory }}" apply -auto-approve -input=false -compact-warnings -var-file="${{ matrix.tfvars }}"