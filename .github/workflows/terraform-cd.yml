name: Terraform CD

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label to execute on.
        required: false
        type: string
        default: arc-runner-set
      terraform_version:
        description: Terraform version to install.
        required: false
        type: string
        default: 1.12.2
      directory:
        description: Terraform stack directory relative to repository root.
        required: true
        type: string
      environment:
        description: Single environment key used to resolve backend settings from .tinitgcp.
        required: false
        type: string
        default: ""
      tfvars:
        description: Optional tfvars file path relative to the stack directory for single apply runs.
        required: false
        type: string
        default: ""
      apply_matrix:
        description: JSON array of objects with environment and tfvars keys for matrix apply runs.
        required: false
        type: string
        default: "[]"
      gcp_workload_identity_provider:
        description: Google workload identity provider resource name for apply auth.
        required: false
        type: string
        default: ""
      gcp_service_account:
        description: Google service account email used for GitHub OIDC apply auth.
        required: false
        type: string
        default: ""

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  apply:
    if: ${{ github.ref == 'refs/heads/main' && inputs.environment != '' && inputs.tfvars != '' && inputs.gcp_workload_identity_provider != '' && inputs.gcp_service_account != '' }}
    runs-on: ${{ inputs.runner }}
    concurrency:
      group: terraform-${{ inputs.directory }}-${{ inputs.environment }}-apply
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Authenticate to Google Cloud
        uses: ./.github/actions/gcp-auth
        with:
          gcp_workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
          gcp_service_account: ${{ inputs.gcp_service_account }}

      - name: Setup Terraform
        uses: ./.github/actions/terraform-setup
        with:
          terraform_version: ${{ inputs.terraform_version }}
          directory: ${{ inputs.directory }}

      - name: Terraform Apply
        uses: ./.github/actions/terraform-apply
        with:
          directory: ${{ inputs.directory }}
          environment: ${{ inputs.environment }}
          tfvars: ${{ inputs.tfvars }}

  apply-matrix:
    if: ${{ github.ref == 'refs/heads/main' && inputs.apply_matrix != '[]' && inputs.gcp_workload_identity_provider != '' && inputs.gcp_service_account != '' }}
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.apply_matrix) }}
    concurrency:
      group: terraform-${{ inputs.directory }}-${{ matrix.environment }}-apply
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Authenticate to Google Cloud
        uses: ./.github/actions/gcp-auth
        with:
          gcp_workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
          gcp_service_account: ${{ inputs.gcp_service_account }}

      - name: Setup Terraform
        uses: ./.github/actions/terraform-setup
        with:
          terraform_version: ${{ inputs.terraform_version }}
          directory: ${{ inputs.directory }}

      - name: Terraform Apply
        uses: ./.github/actions/terraform-apply
        with:
          directory: ${{ inputs.directory }}
          environment: ${{ matrix.environment }}
          tfvars: ${{ matrix.tfvars }}
