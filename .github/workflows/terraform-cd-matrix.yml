name: Terraform CD Matrix

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label to execute on.
        required: false
        type: string
        default: mt0pps-runners
      terraform_version:
        description: Terraform version to install.
        required: false
        type: string
        default: 1.12.2
      directory:
        description: Terraform stack directory relative to repository root.
        required: true
        type: string
      apply_matrix:
        description: JSON array of objects with environment and tfvars keys for matrix apply runs.
        required: false
        type: string
        default: "[]"
      gcp_workload_identity_provider:
        description: Google workload identity provider resource name for apply auth.
        required: false
        type: string
        default: ""
      gcp_service_account:
        description: Google service account email used for GitHub OIDC apply auth.
        required: false
        type: string
        default: ""

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  apply-matrix:
    if: ${{ github.ref == 'refs/heads/main' && inputs.apply_matrix != '[]' && inputs.gcp_workload_identity_provider != '' && inputs.gcp_service_account != '' }}
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.apply_matrix) }}
    concurrency:
      group: terraform-${{ inputs.directory }}-${{ matrix.environment }}-apply
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Authenticate to Google Cloud
        uses: mt0pps/tf-gcp-workflow-templates/.github/actions/gcp-auth@main
        with:
          gcp_workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
          gcp_service_account: ${{ inputs.gcp_service_account }}

      - name: Setup Terraform
        uses: mt0pps/tf-gcp-workflow-templates/.github/actions/terraform-setup@main
        with:
          terraform_version: ${{ inputs.terraform_version }}
          directory: ${{ inputs.directory }}

      - name: Terraform Apply
        uses: mt0pps/tf-gcp-workflow-templates/.github/actions/terraform-apply@main
        with:
          directory: ${{ inputs.directory }}
          environment: ${{ matrix.environment }}
          tfvars: ${{ matrix.tfvars }}
