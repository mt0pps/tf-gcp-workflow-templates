name: Terraform CI

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label to execute on.
        required: false
        type: string
        default: mt0pps-runners
      terraform_version:
        description: Terraform version to install.
        required: false
        type: string
        default: 1.12.2
      directory:
        description: Terraform stack directory relative to repository root.
        required: true
        type: string
      environment:
        description: Single environment key used for plan runs.
        required: false
        type: string
        default: ""
      tfvars:
        description: Optional tfvars file path relative to the stack directory for single plan runs.
        required: false
        type: string
        default: ""
      gcp_workload_identity_provider:
        description: Google workload identity provider resource name for plan auth.
        required: false
        type: string
        default: ""
      gcp_service_account:
        description: Google service account email used for GitHub OIDC plan auth.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  validate:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Terraform
        uses: mt0pps/tf-gcp-workflow-templates/.github/actions/terraform-setup@main
        with:
          terraform_version: ${{ inputs.terraform_version }}
          directory: ${{ inputs.directory }}

      - name: Setup TFLint
        uses: mt0pps/tf-gcp-workflow-templates/.github/actions/terraform-lint@main

      - name: Validate and Lint
        uses: mt0pps/tf-gcp-workflow-templates/.github/actions/terraform-validate@main
        with:
          directory: ${{ inputs.directory }}

  plan:
    needs: validate
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && inputs.environment != '' && inputs.tfvars != '' && inputs.gcp_workload_identity_provider != '' && inputs.gcp_service_account != '' }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Authenticate to Google Cloud
        uses: mt0pps/tf-gcp-workflow-templates/.github/actions/gcp-auth@main
        with:
          gcp_workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
          gcp_service_account: ${{ inputs.gcp_service_account }}

      - name: Setup Terraform
        uses: mt0pps/tf-gcp-workflow-templates/.github/actions/terraform-setup@main
        with:
          terraform_version: ${{ inputs.terraform_version }}
          directory: ${{ inputs.directory }}

      - name: Terraform Plan
        uses: mt0pps/tf-gcp-workflow-templates/.github/actions/terraform-plan@main
        with:
          directory: ${{ inputs.directory }}
          environment: ${{ inputs.environment }}
          tfvars: ${{ inputs.tfvars }}
