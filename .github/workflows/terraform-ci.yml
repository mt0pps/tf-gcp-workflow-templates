name: Terraform CI

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label to execute on.
        required: false
        type: string
        default: mt0pps-runners
      terraform_version:
        description: Terraform version to install.
        required: false
        type: string
        default: 1.12.2
      directory:
        description: Terraform stack directory relative to repository root.
        required: true
        type: string
      environment:
        description: Single environment key used for plan runs.
        required: false
        type: string
        default: ""
      tfvars:
        description: Optional tfvars file path relative to the stack directory for single plan runs.
        required: false
        type: string
        default: ""
      plan_matrix:
        description: JSON array of objects with environment and tfvars keys for matrix plan runs.
        required: false
        type: string
        default: "[]"
      max_parallel:
        description: Maximum parallelism for matrix plan runs.
        required: false
        type: number
        default: 1
      gcp_workload_identity_provider:
        description: Google workload identity provider resource name for plan auth.
        required: false
        type: string
        default: ""
      gcp_service_account:
        description: Google service account email used for GitHub OIDC plan auth.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  validate:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Terraform and TFLint
        uses: ./.github/actions/terraform-setup
        with:
          terraform_version: ${{ inputs.terraform_version }}
          directory: ${{ inputs.directory }}

      - name: Validate and Lint
        uses: ./.github/actions/terraform-validate
        with:
          directory: ${{ inputs.directory }}

  plan:
    needs: validate
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && inputs.environment != '' && inputs.tfvars != '' && inputs.gcp_workload_identity_provider != '' && inputs.gcp_service_account != '' }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Authenticate to Google Cloud
        uses: ./.github/actions/gcp-auth
        with:
          gcp_workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
          gcp_service_account: ${{ inputs.gcp_service_account }}

      - name: Setup Terraform and TFLint
        uses: ./.github/actions/terraform-setup
        with:
          terraform_version: ${{ inputs.terraform_version }}
          directory: ${{ inputs.directory }}

      - name: Terraform Plan
        uses: ./.github/actions/terraform-plan
        with:
          directory: ${{ inputs.directory }}
          environment: ${{ inputs.environment }}
          tfvars: ${{ inputs.tfvars }}

  plan-matrix:
    needs: validate
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && inputs.plan_matrix != '[]' && inputs.gcp_workload_identity_provider != '' && inputs.gcp_service_account != '' }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max_parallel }}
      matrix:
        include: ${{ fromJson(inputs.plan_matrix) }}
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Authenticate to Google Cloud
        uses: ./.github/actions/gcp-auth
        with:
          gcp_workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
          gcp_service_account: ${{ inputs.gcp_service_account }}

      - name: Setup Terraform and TFLint
        uses: ./.github/actions/terraform-setup
        with:
          terraform_version: ${{ inputs.terraform_version }}
          directory: ${{ inputs.directory }}

      - name: Terraform Plan
        uses: ./.github/actions/terraform-plan
        with:
          directory: ${{ inputs.directory }}
          environment: ${{ matrix.environment }}
          tfvars: ${{ matrix.tfvars }}
