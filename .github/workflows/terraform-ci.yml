name: Terraform CI

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label to execute on.
        required: false
        type: string
        default: arc-runner-set
      terraform_version:
        description: Terraform version to install.
        required: false
        type: string
        default: 1.12.2
      directory:
        description: Terraform stack directory relative to repository root.
        required: true
        type: string
      environment:
        description: Single environment key used for plan runs.
        required: false
        type: string
        default: ""
      tfvars:
        description: Optional tfvars file path relative to the stack directory for single plan runs.
        required: false
        type: string
        default: ""
      plan_matrix:
        description: JSON array of objects with environment and tfvars keys for matrix plan runs.
        required: false
        type: string
        default: "[]"
      max_parallel:
        description: Maximum parallelism for matrix plan runs.
        required: false
        type: number
        default: 1
      tfplan2md_version:
        description: tfplan2md release version used for PR plan comments.
        required: false
        type: string
        default: 1.41.0
      post_plan_comment:
        description: Whether to post or update a PR comment with the rendered plan markdown.
        required: false
        type: boolean
        default: true
      gcp_workload_identity_provider:
        description: Google workload identity provider resource name for plan auth.
        required: false
        type: string
        default: ""
      gcp_service_account:
        description: Google service account email used for GitHub OIDC plan auth.
        required: false
        type: string
        default: ""

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  validate:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1

      - name: Ensure plugin cache directory exists
        shell: bash
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform plugins
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-${{ inputs.directory }}-${{ hashFiles(format('{0}/**/.terraform.lock.hcl', inputs.directory)) }}
          restore-keys: |
            ${{ runner.os }}-terraform-${{ inputs.directory }}-
            ${{ runner.os }}-terraform-

      - name: Terraform init without backend
        shell: bash
        run: terraform -chdir="${{ inputs.directory }}" init -backend=false

      - name: Terraform validate
        shell: bash
        run: terraform -chdir="${{ inputs.directory }}" validate

      - name: Terraform lint
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ inputs.directory }}"
          tflint --init
          tflint --recursive --call-module-type=all

  plan:
    needs: validate
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && inputs.environment != '' && inputs.tfvars != '' && inputs.gcp_workload_identity_provider != '' && inputs.gcp_service_account != '' }}
    permissions:
      contents: read
      id-token: write
      issues: write
    uses: mt0pps/tf-gcp-workflow-templates/.github/workflows/terraform-plan-comment.yml@main
    with:
      runner: ${{ inputs.runner }}
      terraform_version: ${{ inputs.terraform_version }}
      directory: ${{ inputs.directory }}
      environment: ${{ inputs.environment }}
      tfvars: ${{ inputs.tfvars }}
      tfplan2md_version: ${{ inputs.tfplan2md_version }}
      post_plan_comment: ${{ inputs.post_plan_comment }}
      gcp_workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
      gcp_service_account: ${{ inputs.gcp_service_account }}

  plan-matrix:
    needs: validate
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && inputs.plan_matrix != '[]' && inputs.gcp_workload_identity_provider != '' && inputs.gcp_service_account != '' }}
    permissions:
      contents: read
      id-token: write
      issues: write
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max_parallel }}
      matrix:
        include: ${{ fromJson(inputs.plan_matrix) }}
    uses: mt0pps/tf-gcp-workflow-templates/.github/workflows/terraform-plan-comment.yml@main
    with:
      runner: ${{ inputs.runner }}
      terraform_version: ${{ inputs.terraform_version }}
      directory: ${{ inputs.directory }}
      environment: ${{ matrix.environment }}
      tfvars: ${{ matrix.tfvars }}
      tfplan2md_version: ${{ inputs.tfplan2md_version }}
      post_plan_comment: ${{ inputs.post_plan_comment }}
      gcp_workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
      gcp_service_account: ${{ inputs.gcp_service_account }}