name: Terraform CI

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label to execute on.
        required: false
        type: string
        default: arc-runner-set
      terraform_version:
        description: Terraform version to install.
        required: false
        type: string
        default: 1.12.2
      directory:
        description: Terraform stack directory relative to repository root.
        required: true
        type: string
      environment:
        description: Single environment key used for plan runs.
        required: false
        type: string
        default: ""
      tfvars:
        description: Optional tfvars file path relative to the stack directory for single plan runs.
        required: false
        type: string
        default: ""
      plan_matrix:
        description: JSON array of objects with environment and tfvars keys for matrix plan runs.
        required: false
        type: string
        default: "[]"
      max_parallel:
        description: Maximum parallelism for matrix plan runs.
        required: false
        type: number
        default: 1
      tfplan2md_version:
        description: tfplan2md release version used for PR plan comments.
        required: false
        type: string
        default: 1.41.0
      post_plan_comment:
        description: Whether to post or update a PR comment with the rendered plan markdown.
        required: false
        type: boolean
        default: true
      gcp_workload_identity_provider:
        description: Google workload identity provider resource name for plan auth.
        required: false
        type: string
        default: ""
      gcp_service_account:
        description: Google service account email used for GitHub OIDC plan auth.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write
  issues: write

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  validate:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1

      - name: Ensure plugin cache directory exists
        shell: bash
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform plugins
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-${{ inputs.directory }}-${{ hashFiles(format('{0}/**/.terraform.lock.hcl', inputs.directory)) }}
          restore-keys: |
            ${{ runner.os }}-terraform-${{ inputs.directory }}-
            ${{ runner.os }}-terraform-

      - name: Terraform init without backend
        shell: bash
        run: terraform -chdir="${{ inputs.directory }}" init -backend=false

      - name: Terraform validate
        shell: bash
        run: terraform -chdir="${{ inputs.directory }}" validate

      - name: Terraform lint
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ inputs.directory }}"
          tflint --init
          tflint --recursive --call-module-type=all

  plan:
    needs: validate
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && inputs.environment != '' && inputs.tfvars != '' && inputs.gcp_workload_identity_provider != '' && inputs.gcp_service_account != '' }}
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
          service_account: ${{ inputs.gcp_service_account }}
          create_credentials_file: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Setup tfplan2md
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|amd64) platform="linux-x64" ;;
            aarch64|arm64) platform="linux-arm64" ;;
            *)
              echo "Unsupported architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          workdir="$RUNNER_TEMP/tfplan2md"
          mkdir -p "$workdir/bin"
          archive="$workdir/tfplan2md.tar.gz"

          curl -fsSL \
            -o "$archive" \
            "https://github.com/oocx/tfplan2md/releases/download/v${{ inputs.tfplan2md_version }}/tfplan2md_${{ inputs.tfplan2md_version }}_${platform}.tar.gz"

          tar -xzf "$archive" -C "$workdir/bin"
          chmod +x "$workdir/bin/tfplan2md"
          echo "$workdir/bin" >> "$GITHUB_PATH"

      - name: Ensure plugin cache directory exists
        shell: bash
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform plugins
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-${{ inputs.directory }}-${{ hashFiles(format('{0}/**/.terraform.lock.hcl', inputs.directory)) }}
          restore-keys: |
            ${{ runner.os }}-terraform-${{ inputs.directory }}-
            ${{ runner.os }}-terraform-

      - name: Terraform init with tinitgcp
        shell: bash
        run: cd "${{ inputs.directory }}" && bash "$GITHUB_WORKSPACE/bin/tinitgcp" "${{ inputs.environment }}"

      - name: Terraform plan
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="${{ inputs.directory }}" plan -refresh=false -lock=false -input=false -compact-warnings -var-file="${{ inputs.tfvars }}" -out=plan.tfplan
          terraform -chdir="${{ inputs.directory }}" show -json plan.tfplan > "${{ inputs.directory }}/plan-${{ inputs.environment }}.json"
          tfplan2md "${{ inputs.directory }}/plan-${{ inputs.environment }}.json" \
            --render-target github \
            --report-title "Terraform Plan: ${{ inputs.directory }} (${{ inputs.environment }})" \
            --output "${{ inputs.directory }}/plan-${{ inputs.environment }}.md"

      - name: Comment PR with plan
        if: ${{ inputs.post_plan_comment }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          COMMENT_MARKER: <!-- tfplan2md:${{ inputs.directory }}:${{ inputs.environment }} -->
          PLAN_FILE: ${{ inputs.directory }}/plan-${{ inputs.environment }}.md
          COMMENT_HEADER: Terraform plan for `${{ inputs.directory }}` (`${{ inputs.environment }}`)
        with:
          script: |
            const fs = require('fs');

            const marker = process.env.COMMENT_MARKER;
            const planFile = process.env.PLAN_FILE;
            const header = process.env.COMMENT_HEADER;
            let body = fs.readFileSync(planFile, 'utf8');
            body = `${marker}\n## ${header}\n\n${body}`;

            const maxLength = 60000;
            if (body.length > maxLength) {
              body = `${body.slice(0, maxLength)}\n\n...\n\n_Plan comment truncated because it exceeded the GitHub comment size limit._`;
            }

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  plan-matrix:
    needs: validate
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && inputs.plan_matrix != '[]' && inputs.gcp_workload_identity_provider != '' && inputs.gcp_service_account != '' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max_parallel }}
      matrix:
        include: ${{ fromJson(inputs.plan_matrix) }}
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
          service_account: ${{ inputs.gcp_service_account }}
          create_credentials_file: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Setup tfplan2md
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|amd64) platform="linux-x64" ;;
            aarch64|arm64) platform="linux-arm64" ;;
            *)
              echo "Unsupported architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          workdir="$RUNNER_TEMP/tfplan2md"
          mkdir -p "$workdir/bin"
          archive="$workdir/tfplan2md.tar.gz"

          curl -fsSL \
            -o "$archive" \
            "https://github.com/oocx/tfplan2md/releases/download/v${{ inputs.tfplan2md_version }}/tfplan2md_${{ inputs.tfplan2md_version }}_${platform}.tar.gz"

          tar -xzf "$archive" -C "$workdir/bin"
          chmod +x "$workdir/bin/tfplan2md"
          echo "$workdir/bin" >> "$GITHUB_PATH"

      - name: Ensure plugin cache directory exists
        shell: bash
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform plugins
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-terraform-${{ inputs.directory }}-${{ hashFiles(format('{0}/**/.terraform.lock.hcl', inputs.directory)) }}
          restore-keys: |
            ${{ runner.os }}-terraform-${{ inputs.directory }}-
            ${{ runner.os }}-terraform-

      - name: Terraform init with tinitgcp
        shell: bash
        run: cd "${{ inputs.directory }}" && bash "$GITHUB_WORKSPACE/bin/tinitgcp" "${{ matrix.environment }}"

      - name: Terraform plan
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="${{ inputs.directory }}" plan -refresh=false -lock=false -input=false -compact-warnings -var-file="${{ matrix.tfvars }}" -out=plan.tfplan
          terraform -chdir="${{ inputs.directory }}" show -json plan.tfplan > "${{ inputs.directory }}/plan-${{ matrix.environment }}.json"
          tfplan2md "${{ inputs.directory }}/plan-${{ matrix.environment }}.json" \
            --render-target github \
            --report-title "Terraform Plan: ${{ inputs.directory }} (${{ matrix.environment }})" \
            --output "${{ inputs.directory }}/plan-${{ matrix.environment }}.md"

      - name: Comment PR with plan
        if: ${{ inputs.post_plan_comment }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          COMMENT_MARKER: <!-- tfplan2md:${{ inputs.directory }}:${{ matrix.environment }} -->
          PLAN_FILE: ${{ inputs.directory }}/plan-${{ matrix.environment }}.md
          COMMENT_HEADER: Terraform plan for `${{ inputs.directory }}` (`${{ matrix.environment }}`)
        with:
          script: |
            const fs = require('fs');

            const marker = process.env.COMMENT_MARKER;
            const planFile = process.env.PLAN_FILE;
            const header = process.env.COMMENT_HEADER;
            let body = fs.readFileSync(planFile, 'utf8');
            body = `${marker}\n## ${header}\n\n${body}`;

            const maxLength = 60000;
            if (body.length > maxLength) {
              body = `${body.slice(0, maxLength)}\n\n...\n\n_Plan comment truncated because it exceeded the GitHub comment size limit._`;
            }

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }