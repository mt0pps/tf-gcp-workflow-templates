name: Setup Terraform
description: Setup Terraform and plugin cache

inputs:
  terraform_version:
    description: Terraform version to install
    required: true
  directory:
    description: Terraform stack directory
    required: true

runs:
  using: composite
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
      with:
        terraform_version: ${{ inputs.terraform_version }}
        terraform_wrapper: false

    - name: Ensure plugin cache directory exists
      shell: bash
      run: mkdir -p "${{ env.TF_PLUGIN_CACHE_DIR }}"

    - name: Cache Terraform plugins
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4.2.4
      with:
        path: ${{ env.TF_PLUGIN_CACHE_DIR }}
        key: ${{ runner.os }}-terraform-${{ inputs.directory }}-${{ hashFiles(format('{0}/**/.terraform.lock.hcl', inputs.directory)) }}
        restore-keys: |
          ${{ runner.os }}-terraform-${{ inputs.directory }}-
          ${{ runner.os }}-terraform-
