name: Setup Terraform
description: Setup Terraform and plugin cache

inputs:
  terraform_version:
    description: Terraform version to install
    required: true
    default: 1.15.7
  directory:
    description: Terraform stack directory
    required: true
  tflint_version:
    description: TFLint version to install
    required: true
    default: v0.64.0

runs:
  using: composite
  steps:
    - name: "Setup Terraform - Version: ${{ inputs.terraform_version }}"
      uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
      with:
        terraform_version: ${{ inputs.terraform_version }}
        terraform_wrapper: false

    - name: "Setup TFLint - Version: ${{ inputs.tflint_version }}"
      uses: terraform-linters/setup-tflint@b480b8fcdaa6f2c577f8e4fa799e89e756bb7c93 # v6.2.2
      with:
        tflint_version: ${{ inputs.tflint_version }}

    - name: Show Terraform and TFLint versions
      shell: bash
      run: |
        terraform version
        tflint --version
