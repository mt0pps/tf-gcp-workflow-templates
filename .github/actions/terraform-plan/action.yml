name: Terraform Plan
description: Initialize Terraform backend and run terraform plan

inputs:
  directory:
    description: Terraform stack directory
    required: true
  environment:
    description: Environment name
    required: true
  tfvars:
    description: Path to tfvars file
    required: true

runs:
  using: composite
  steps:
    - name: Terraform init with tinitgcp
      shell: bash
      run: cd "${{ inputs.directory }}" && bash "${{ github.action_path }}/tinitgcp" "${{ inputs.environment }}"

    - name: Terraform plan
      shell: bash
      run: |
        set -euo pipefail
        terraform -chdir="${{ inputs.directory }}" plan -refresh=false -lock=false -input=false -compact-warnings -var-file="${{ inputs.tfvars }}" -out=plan.tfplan
        terraform -chdir="${{ inputs.directory }}" show -json plan.tfplan > "${{ inputs.directory }}/plan-${{ inputs.environment }}.json"
